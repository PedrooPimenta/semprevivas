    <script>
        $(document).ready(function () {
            $('#logout-link').click(function (event) {
                event.preventDefault(); // Evitar o comportamento padrão do link
                var logoutUrl = $(this).data('logout-url'); // Obter a URL de logout do atributo de dados
                $.post(logoutUrl, function () {
                    // Redirecionar para a página de login ou para onde desejar após o logout
                    window.location.href = "{% url 'home' %}";
                });
            });
        });



        document.addEventListener('DOMContentLoaded', function () {
            const thumbs = document.querySelectorAll('.home-carousel-thumb-semprevivas');
            const slides = document.querySelectorAll('.home-carousel-slide-semprevivas');

            thumbs.forEach(thumb => {
                thumb.addEventListener('click', function () {
                    const index = this.getAttribute('data-index');

                    // Remove active class from all
                    thumbs.forEach(t => t.classList.remove('active'));
                    slides.forEach(s => s.classList.remove('active'));

                    // Add active class to clicked thumb and corresponding slide
                    this.classList.add('active');
                    slides[index].classList.add('active');
                });
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            thumbs.forEach(thumb => {
