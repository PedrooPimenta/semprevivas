{% extends 'base.html' %}
{% load static %}

{% block title %} Confirmar Exclusão {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Confirmar Exclusão</h5>
                </div>
                <div class="card-body">
                    <p class="fs-5">Tem certeza de que deseja excluir o usuário <strong>{{ usuario.username }}</strong>?</p>
                    <p class="text-muted">Esta ação não poderá ser desfeita.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'listar_usuarios' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
